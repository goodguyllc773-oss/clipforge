[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Local-first AI clipping engine: long video in, captioned vertical clips out."
requires-python = ">=3.10"
# Ranges are deliberately bounded on the major version. Versions verified by the
# test suite are recorded in requirements.lock.txt.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "SQLAlchemy>=2.0.30,<2.2",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<6",
    "faster-whisper>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: renders real video with ffmpeg (seconds each)",
    "whisper: needs a downloaded faster-whisper model (set CLIPFORGE_TEST_WHISPER_MODEL)",
]
