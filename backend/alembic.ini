# Used only for authoring migrations by hand:
#   alembic -c alembic.ini upgrade head          (from backend/; brings ./dev-clipforge.db to head)
#   alembic -c alembic.ini revision --autogenerate -m "msg"   (diff of models vs. that DB)
# The app runs migrations itself on startup (clipforge.db.session.run_migrations).
[alembic]
script_location = clipforge/db/migrations
sqlalchemy.url = sqlite:///./dev-clipforge.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
